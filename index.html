<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to The Great Meme Reset 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Countdown Container -->
  <div class="container">
    <h1>Countdown to The Great Meme Reset 2026</h1>
    <div class="countdown" id="countdown"></div>
    <button id="contribute-btn">Contribute</button>
    <div id="contribution-count">0 people contributing</div>
  </div>

  <!-- Community Stats Section -->
  <div class="community-box">
    <h2>Community Stats</h2>
    <div id="viewerCount" class="stat-item">👁️ Total Viewers: 0</div>

    <div class="like-container">
      <button id="likeButton" class="like-button">👍 Like</button>
      <span id="likeCount" class="like-count">0</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
