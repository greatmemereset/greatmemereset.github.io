<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great Meme Reset 2026 Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Countdown to The Great Meme Reset 2026</h1>
    <div id="countdown" class="countdown"></div>
    <button id="contribute-btn">Contribute</button>
    <div id="contribution-count">0 people contributing</div>
  </div>

  <div class="community-box">
    <h2>Community Stats</h2>
    <div id="totalVisits" class="stat-item">🌍 Total Visits: 0</div>
    <div id="currentViewers" class="stat-item">👁️ Current Viewers: 0</div>
    <div class="like-container">
      <button id="likeButton" class="like-button">👍 Like</button>
      <span id="likeCount" class="like-count">0</span>
    </div>
  </div>

  <div class="share-box">
    <h3>🔥 Spread The Great Meme Reset 2026 🔥</h3>
    <p>Share this site and awaken the internet!</p>
    <div class="share-buttons">
      <button class="share-btn" id="copyLink">📋 Copy Link</button>
      <a id="shareX" class="share-btn" target="_blank">🐦 Share on X</a>
      <a id="shareReddit" class="share-btn" target="_blank">👽 Share on Reddit</a>
    </div>
    <p id="copyMessage" style="display:none;">✅ Link copied!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
