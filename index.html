<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Great Meme Reset 2026 — Countdown</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="bg-overlay" aria-hidden="true"></div>
  <main class="wrap">
    <section class="card" role="region" aria-label="Countdown to the Great Meme Reset 2026">
      <div class="title">
        <h1>The Great Meme Reset — Jan 1, 2026</h1>
        <div class="subtitle" id="tz-label">Your timezone</div>
      </div>

      <div class="countdown" aria-live="polite" id="countdown">
        <!-- segments inserted by script -->
      </div>

      <p class="tiny-note" id="note">Countdown target: midnight on January 1, 2026 (local time). Display shows full months, then remaining weeks/days/hours/mins/seconds.</p>

      <div class="meta">
        <div class="chip" id="now-time">Now: —</div>
        <div class="chip" id="target-time">Target: —</div>
        <div class="chip" id="viewers-count">Viewers online: —</div>
      </div>

      <div class="clicker">
        <button id="contribBtn" aria-label="Contribute to the global count">Contribute</button>
        <p id="contribText">0 of people contributing</p>
      </div>

    </section>
  </main>

  <!-- Confetti (CDN) and Socket.IO client -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
