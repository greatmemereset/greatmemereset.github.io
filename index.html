<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great Meme Reset 2026 Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>The Great Meme Reset 2026</h1>
    <p class="desc">A new era of memes begins soon. Join the countdown to the reset of internet culture.</p>
    <div id="countdown" class="countdown"></div>
    <button id="contribute-btn">Contribute</button>
    <div id="contribution-count">0 people contributing</div>
  </div>

  <div class="community-box">
    <h2>Community Stats</h2>
    <div id="viewerCount" class="stat-item">🌍 Total Visits: 0</div>
    <div id="currentViewers" class="stat-item">👁️ Current Viewers: 1</div>
    <div class="like-container">
      <button id="likeButton" class="like-button">❤️ Like</button>
      <span id="likeCount" class="like-count">0</span>
    </div>

    <div class="share">
      <h3>Share This Countdown</h3>
      <div class="share-buttons">
        <a id="shareX" target="_blank">🐦 X</a>
        <a id="shareReddit" target="_blank">🔺 Reddit</a>
        <button id="copyLink">🔗 Copy Link</button>
      </div>
      <p id="copyMessage" style="display:none;">Copied to clipboard!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
