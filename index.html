<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown to The Great Meme Reset 2026</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://counterapi.com/c.js?ns=great-meme-reset-2026" async></script>
  </head>
  <body>
    <!-- Main Countdown Container -->
    <div class="container">
      <h1>Countdown to The Great Meme Reset 2026</h1>
      <div class="countdown" id="countdown"></div>
      <button id="contribute-btn">Contribute</button>
      <div id="contribution-count"></div>

    <!-- Community Stats Section -->
    <div class="community-stats">
      <h2>Community Stats</h2>
      <div id="viewerCount" class="counter-display">Viewers online: 0</div>
      <div>
        <button id="likeButton" class="like-button">👍 Like</button>
        <span id="likeCount">0</span>
      </div>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
  </body>
</html>
